<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamHub – Authentication Portal</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary: #2563eb;
      --teal: #14b8a6;
    }

    body {
      background: #f1f5f9;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4 py-10">

  <div class="w-full max-w-md bg-white rounded-xl shadow-xl p-8 border border-gray-100">
    <!-- Header -->
    <div class="text-center mb-6">
      <svg class="w-12 h-12 mx-auto mb-3" viewBox="0 0 54 54" fill="none">
        <rect x="8" y="8" width="38" height="32" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
        <path d="M27 7L42 14L27 21L12 14L27 7Z" fill="#14b8a6" stroke="#14b8a6" stroke-width="1" />
      </svg>
      <h1 class="text-2xl font-bold text-indigo-700">ExamHub Portal</h1>
      <p class="text-sm text-gray-500">Multi-Level Authentication System</p>
    </div>

    <!-- Tabs -->
    <div class="flex mb-6">
      <button id="loginTab" class="tab-btn active flex-1 py-2 rounded-t-lg" onclick="switchTab('login')">Login</button>
      <button id="registerTab" class="tab-btn flex-1 py-2 rounded-t-lg"
        onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN -->
    <div id="loginForm">
      <form id="signinForm" class="space-y-4">
        <div>
          <label class="text-sm text-gray-600">Select Role</label>
          <select id="loginRole" class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-indigo-500"
            required>
            <option value="">-- Choose Role --</option>
            <option value="STUDENT">Student</option>
            <option value="SUPERVISOR">Supervisor</option>
            <option value="UNIVERSITY_ADMIN">Institution Admin</option>
            <option value="SUPERADMIN">Super Admin</option>
          </select>
        </div>

        <!-- STUDENT LOGIN -->
        <div id="studentLoginFields" class="hidden">
          <label class="text-sm text-gray-600">Login Using</label>
          <select id="studentLoginType" class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-indigo-500"
            onchange="toggleStudentLoginMethod(this.value)">
            <option value="email">Email (OTP Required)</option>
            <option value="username">Username (No OTP)</option>
          </select>

          <!-- Email Login -->
          <div id="studentEmailLogin" class="mt-3">
            <label class="text-sm text-gray-600">Email Address</label>
            <div class="flex gap-2 mt-1">
              <input type="email" id="studentLoginEmail"
                class="flex-1 border rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500"
                placeholder="Enter your email">
              <button type="button" id="studentSendOtpBtn" onclick="sendOTP('studentLoginEmail')"
                class="px-3 py-2 text-sm bg-indigo-600 text-white rounded hover:bg-indigo-700 transition">
                Send OTP
              </button>
            </div>
            <div id="studentEmailOtpSection" class="hidden mt-3">
              <label class="text-sm text-gray-600">Enter Email OTP</label>
              <div class="flex gap-2 mt-1">
                <input id="studentEmailOtp" type="text" maxlength="6"
                  class="flex-1 border rounded px-3 py-2 text-center tracking-widest" placeholder="Enter OTP">
                <button type="button" id="verifyStudentEmailOtpBtn" onclick="verifyOTP('studentLoginEmail')"
                  class="px-3 py-2 text-sm bg-teal-600 text-white rounded">Verify</button>
              </div>
              <p id="studentEmailOtpMsg" class="text-xs text-gray-500 mt-1"></p>
            </div>
          </div>

          <!-- Username Login -->
          <div id="studentUsernameLogin" class="hidden mt-3">
            <label class="text-sm text-gray-600">Username (Student Name)</label>
            <input type="text" id="studentLoginUsername"
              class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-indigo-500"
              placeholder="Enter your name">
          </div>

          <!-- Password -->
          <label class="text-sm text-gray-600 mt-3 block">Password</label>
          <div class="relative">
            <input type="password" id="studentLoginPassword"
              class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-indigo-500 pr-10"
              placeholder="••••••••" required>
            <button type="button" onclick="togglePassword('studentLoginPassword', this)"
              class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500"
              aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- AUTHORITY LOGIN -->
        <div id="authoritySteps" class="hidden">
          <div>
            <label class="text-sm text-gray-600">Official Email</label>
            <div class="flex gap-2 mt-1">
              <input type="email" id="authEmail"
                class="flex-1 border rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500"
                placeholder="email@institution.edu">
              <button type="button" id="sendEmailOtpBtn" onclick="sendOTP('email')"
                class="px-3 py-2 text-sm bg-indigo-600 text-white rounded hover:bg-indigo-700 transition">Send
                OTP</button>
            </div>
            <div id="emailOtpSection" class="hidden mt-3">
              <label class="text-sm text-gray-600">Enter Email OTP</label>
              <div class="flex gap-2 mt-1">
                <input id="emailOtp" type="text" maxlength="6"
                  class="flex-1 border rounded px-3 py-2 text-center tracking-widest" placeholder="Enter OTP">
                <button type="button" id="verifyEmailOtpBtn" onclick="verifyOTP('email')"
                  class="px-3 py-2 text-sm bg-teal-600 text-white rounded">Verify</button>
              </div>
              <p id="emailOtpMsg" class="text-xs text-gray-500 mt-1"></p>
            </div>
          </div>
        </div>

        <button id="loginButton" type="submit" disabled
          class="w-full bg-gray-400 text-white py-2 rounded-lg font-semibold mt-4">
          Login
        </button>
      </form>
    </div>

    <!-- REGISTER -->
    <div id="registerForm" class="hidden">
      <form id="signupForm" class="space-y-4" novalidate>
        <label class="text-sm text-gray-600">Select Role</label>
        <select id="regRole" name="role" class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-indigo-500"
          required>
          <option value="">-- Choose Role --</option>
          <option value="STUDENT">Student</option>
          <option value="SUPERVISOR">Supervisor</option>
          <option value="UNIVERSITY_ADMIN">Institution Admin</option>
        </select>

        <!-- Student Registration -->
        <div id="studentReg" class="hidden">
          <input type="text" name="fullName" placeholder="Full Name" class="w-full border rounded px-3 py-2 mt-1"
            required>
          <input type="text" name="rollNumber" placeholder="Roll Number / Student ID"
            class="w-full border rounded px-3 py-2 mt-1" required>

          <label class="text-sm text-gray-600">Email Address</label>
          <div class="flex gap-2 mt-1">
            <input type="email" id="regEmailStudent" name="email"
              class="flex-1 border rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500" placeholder="example@email.com"
              required>
            <button type="button" id="sendRegEmailOtpBtnStudent" onclick="sendOTP('regEmailStudent')"
              class="px-3 py-2 text-sm bg-indigo-600 text-white rounded hover:bg-indigo-700 transition">Send
              OTP</button>
          </div>

          <div id="regEmailOtpSectionStudent" class="hidden mt-3">
            <label class="text-sm text-gray-600">Enter Email OTP</label>
            <div class="flex gap-2 mt-1">
              <input id="regEmailOtpStudent" type="text" maxlength="6"
                class="flex-1 border rounded px-3 py-2 text-center tracking-widest" placeholder="Enter OTP">
              <button type="button" id="verifyRegEmailOtpBtnStudent" onclick="verifyOTP('regEmailStudent')"
                class="px-3 py-2 text-sm bg-teal-600 text-white rounded">Verify</button>
            </div>
            <p id="regEmailOtpMsgStudent" class="text-xs text-gray-500 mt-1"></p>
          </div>

          <label class="text-sm text-gray-600 mt-2">Phone</label>
          <div class="flex gap-2 mt-1">
            <input type="tel" id="regPhoneStudent" name="phone"
              class="flex-1 border rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500" placeholder="+91 9876543210"
              required>
            <button type="button" id="sendRegPhoneOtpBtnStudent" onclick="sendOTP('regPhoneStudent')"
              class="px-3 py-2 text-sm bg-indigo-600 text-white rounded hover:bg-indigo-700 transition">Send
              OTP</button>
          </div>

          <div id="regPhoneOtpSectionStudent" class="hidden mt-3">
            <label class="text-sm text-gray-600">Enter Mobile OTP</label>
            <div class="flex gap-2 mt-1">
              <input id="regPhoneOtpStudent" type="text" maxlength="6"
                class="flex-1 border rounded px-3 py-2 text-center tracking-widest" placeholder="Enter OTP">
              <button type="button" id="verifyRegPhoneOtpBtnStudent" onclick="verifyOTP('regPhoneStudent')"
                class="px-3 py-2 text-sm bg-teal-600 text-white rounded">Verify</button>
            </div>
            <p id="regPhoneOtpMsgStudent" class="text-xs text-gray-500 mt-1"></p>
          </div>

          <input type="password" id="regPasswordStudent" name="password"
            class="w-full border rounded px-3 py-2 mt-1 pr-10 focus:ring-2 focus:ring-indigo-500"
            placeholder="Create Password" required>

          <label class="text-sm text-gray-600 mt-2">Upload ID Proof</label>
          <input type="file" id="regIdProofStudent" name="idProof" accept=".jpg,.png,.pdf"
            class="w-full text-sm text-gray-600 mt-1" required>
        </div>

        <!-- Authority Registration -->
        <div id="authorityReg" class="hidden">
          <input type="text" name="fullName" placeholder="Full Name" class="w-full border rounded px-3 py-2 mt-1"
            required>
          <input type="text" name="organization" placeholder="Institution / Organization"
            class="w-full border rounded px-3 py-2 mt-1" required>

          <label class="text-sm text-gray-600">Email</label>
          <div class="flex gap-2 mt-1">
            <input type="email" id="regEmailAuthority" name="email"
              class="flex-1 border rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500" placeholder="example@email.com"
              required>
            <button type="button" id="sendRegEmailOtpBtnAuthority" onclick="sendOTP('regEmailAuthority')"
              class="px-3 py-2 text-sm bg-indigo-600 text-white rounded hover:bg-indigo-700 transition">Send
              OTP</button>
          </div>

          <div id="regEmailOtpSectionAuthority" class="hidden mt-3">
            <label class="text-sm text-gray-600">Enter Email OTP</label>
            <div class="flex gap-2 mt-1">
              <input id="regEmailOtpAuthority" type="text" maxlength="6"
                class="flex-1 border rounded px-3 py-2 text-center tracking-widest" placeholder="Enter OTP">
              <button type="button" id="verifyRegEmailOtpBtnAuthority" onclick="verifyOTP('regEmailAuthority')"
                class="px-3 py-2 text-sm bg-teal-600 text-white rounded">Verify</button>
            </div>
            <p id="regEmailOtpMsgAuthority" class="text-xs text-gray-500 mt-1"></p>
          </div>

          <label class="text-sm text-gray-600 mt-2">Phone</label>
          <div class="flex gap-2 mt-1">
            <input type="tel" id="regPhoneAuthority" name="phone"
              class="flex-1 border rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500" placeholder="+91 9876543210"
              required>
            <button type="button" id="sendRegPhoneOtpBtnAuthority" onclick="sendOTP('regPhoneAuthority')"
              class="px-3 py-2 text-sm bg-indigo-600 text-white rounded hover:bg-indigo-700 transition">Send
              OTP</button>
          </div>

          <div id="regPhoneOtpSectionAuthority" class="hidden mt-3">
            <label class="text-sm text-gray-600">Enter Phone OTP</label>
            <div class="flex gap-2 mt-1">
              <input id="regPhoneOtpAuthority" type="text" maxlength="6"
                class="flex-1 border rounded px-3 py-2 text-center tracking-widest" placeholder="Enter OTP">
              <button type="button" id="verifyRegPhoneOtpBtnAuthority" onclick="verifyOTP('regPhoneAuthority')"
                class="px-3 py-2 text-sm bg-teal-600 text-white rounded">Verify</button>
            </div>
            <p id="regPhoneOtpMsgAuthority" class="text-xs text-gray-500 mt-1"></p>
          </div>

          <input type="password" id="regPasswordAuthority" name="password"
            class="w-full border rounded px-3 py-2 mt-1 pr-10 focus:ring-2 focus:ring-indigo-500"
            placeholder="Create Password" required>

          <label class="text-sm text-gray-600 mt-2">Upload ID Proof</label>
          <input type="file" id="regIdProofAuthority" name="idProof" accept=".jpg,.png,.pdf"
            class="w-full text-sm text-gray-600 mt-1" required>
        </div>

        <button type="submit"
          class="w-full bg-teal-600 hover:bg-teal-700 text-white py-2 rounded-lg font-semibold mt-3">
          Submit Registration
        </button>
      </form>
    </div>

    <div class="text-center mt-4">
      <a href="index.html" class="text-sm text-gray-600 hover:text-indigo-600 transition-colors">← Back to Home</a>
    </div>
  </div>

  <!-- Script -->
  <script src="script.js?v=2"></script>
  <script>
    // Safe updateRegistration function
    function updateRegistration() {
      const roleEl = document.getElementById("regRole");
      if (!roleEl) return;
      const role = roleEl.value;
      const student = document.getElementById("studentReg");
      const authority = document.getElementById("authorityReg");
      if (!student || !authority) return;
      student.classList.toggle("hidden", role !== "STUDENT");
      authority.classList.toggle("hidden", role === "STUDENT" || role === "");
    }

    document.addEventListener("DOMContentLoaded", () => {
      const roleSelect = document.getElementById("regRole");
      if (roleSelect) {
        roleSelect.addEventListener("change", updateRegistration);
        updateRegistration();
      }
    });
  </script>
</body>

</html>
