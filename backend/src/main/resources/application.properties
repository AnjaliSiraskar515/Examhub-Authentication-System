# ============================================
# 🔹 SERVER CONFIGURATION
# ============================================
spring.config.import=optional:classpath:application-secret.properties
server.port=${PORT:8081}
spring.application.name=ExamHub Authentication System

# ============================================
# 🔹 DATABASE (MySQL)
# ============================================
# 🔹 DATABASE (MySQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# 🔹 JPA / HIBERNATE SETTINGS
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# 🔹 BREVO CLOUD EMAIL API
# ============================================
brevo.api.key=${BREVO_API_KEY}

# ============================================
# 🔹 FAST2SMS CONFIG
# ============================================
fast2sms.api.key=${FAST2SMS_API_KEY:YOUR_DEFAULT_API_KEY}


# ============================================
# 🔹 JWT (Security)
# ============================================
jwt.secret=${JWT_SECRET:8a4c8a2b1f8e9d3c5f4b2a8e9d1c7f4b8a2e1d5c9f7b4a6e3d2c1b5f8a9e4d7c}
jwt.expirationMs=3600000

# ============================================
# 🔹 OTP CONFIGURATION
# ============================================
otp.expiration.minutes=5

# ============================================
# FILE UPLOAD CONFIGURATION (Profile Photos)
# ============================================

# Folder where uploaded profile photos will be stored
# This means inside your backend project:
# backend/uploads/profile/
file.upload-dir=uploads/profile


# Maximum size allowed for single uploaded file
# (Profile photo should not exceed 10MB)
spring.servlet.multipart.max-file-size=10MB


# Maximum total request size (if multiple files uploaded together)
spring.servlet.multipart.max-request-size=10MB
